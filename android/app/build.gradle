plugins { id 'com.android.application' }

// Signing key lives outside git (android/keystore.properties + the .jks it names).
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ks.load(new FileInputStream(ksFile))

android {
    namespace 'app.drivez' // also set as package= in the manifest for build-apk.sh
    compileSdk 34
    defaultConfig {
        applicationId 'app.drivez'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.4'
        buildConfigField 'String', 'SITE', '"https://drivez.webb-home.workers.dev"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
