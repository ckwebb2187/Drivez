name = "drivez"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "drivez"
database_id = "5af0f8b5-4530-4d5a-ad01-bfbbbee89c43"

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true
