<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
<radialGradient id="bg" cx="52%" cy="45%" r="75%"><stop offset="0" stop-color="#0f1b26"/><stop offset="0.6" stop-color="#0a1016"/><stop offset="1" stop-color="#05080b"/></radialGradient>
<linearGradient id="car" x1="0" y1="0.5" x2="1" y2="0.4"><stop offset="0" stop-color="#1aa3ff"/><stop offset="0.5" stop-color="#2fe0ff"/><stop offset="1" stop-color="#8cff3a"/></linearGradient>
<linearGradient id="road" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1aa3ff" stop-opacity="0.1"/><stop offset="0.5" stop-color="#2fe0ff"/><stop offset="1" stop-color="#9dff4a"/></linearGradient>
<radialGradient id="halo" cx="45%" cy="55%" r="45%"><stop offset="0" stop-color="#1aa3ff" stop-opacity="0.35"/><stop offset="1" stop-color="#1aa3ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
