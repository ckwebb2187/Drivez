<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Home Base TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
:root { --bg:#0E1412; --bg2:#16201C; --ink:#EEF2EF; --ink2:#A9B6B0; --accent:#6DC2A4; --gold:#F0B43C; --glowA:rgba(109,194,164,.24); --glowG:rgba(240,180,60,.14);
  --haloA:rgba(109,194,164,.45); --haloG:rgba(240,180,60,.38);
  --card:rgba(30,40,36,.72); --line:rgba(255,255,255,.08); --row:30vh;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif; --f-holiday:var(--f-display); --f-holiday-w:700; color-scheme:dark }
html, body { margin:0; height:100%; overflow:hidden; cursor:none }
body { background:radial-gradient(130vh 95vh at 8% -10%, var(--glowA), transparent 70%), radial-gradient(110vh 85vh at 100% 35%, var(--glowG), transparent 70%), linear-gradient(180deg, var(--bg2), var(--bg) 75%);
  background-color:var(--bg); color:var(--ink); font-family:var(--f-body); opacity:0; transition:opacity .5s ease }
body.ready { opacity:1 }
/* Slow glowing light drifting behind everything (big soft gradients moved with transforms, which the TV box handles easily). */
#glow { position:fixed; inset:0; pointer-events:none; overflow:hidden }
#glow i { position:absolute; border-radius:50%; will-change:transform; opacity:.9 }
#glow .g1 { width:95vh; height:95vh; left:-20vh; top:-30vh; background:radial-gradient(closest-side, var(--glowA), transparent); animation:tv-drift1 70s ease-in-out infinite alternate }
#glow .g2 { width:85vh; height:85vh; right:-18vh; top:18vh; background:radial-gradient(closest-side, var(--glowG), transparent); animation:tv-drift2 85s ease-in-out infinite alternate }
#glow .g3 { width:70vh; height:70vh; left:38vw; bottom:-35vh; background:radial-gradient(closest-side, var(--glowA), transparent); opacity:.55; animation:tv-drift3 95s ease-in-out infinite alternate }
@keyframes tv-drift1 { from { transform:translate(0,0) scale(1) } to { transform:translate(22vw,14vh) scale(1.18) } }
@keyframes tv-drift2 { from { transform:translate(0,0) scale(1.1) } to { transform:translate(-26vw,-10vh) scale(.9) } }
@keyframes tv-drift3 { from { transform:translate(0,0) } to { transform:translate(-18vw,-12vh) } }
#pat { position:fixed; inset:0; background-image:var(--pat, none); background-size:48vh 48vh; opacity:.08; pointer-events:none }
#fade { position:fixed; left:0; right:0; bottom:0; height:calc(var(--row) + 8vh); background:linear-gradient(180deg, transparent, rgba(0,0,0,.5)); pointer-events:none }
body.saver #fade { display:none }
#motes { position:fixed; inset:0; pointer-events:none; overflow:hidden }
#motes i { position:absolute; bottom:-4vh; border-radius:50%; background:var(--c); box-shadow:0 0 1.4vh .5vh var(--c), 0 0 4vh 1.2vh var(--c); opacity:.0;
  animation-name:tv-rise, tv-sway; animation-timing-function:linear, ease-in-out; animation-iteration-count:infinite; animation-direction:normal, alternate }
@keyframes tv-rise { 0% { transform:translateY(0); opacity:0 } 10% { opacity:.6 } 85% { opacity:.45 } 100% { transform:translateY(-110vh); opacity:0 } }
@keyframes tv-sway { from { margin-left:-1.5vw } to { margin-left:1.5vw } }
#wrap { position:fixed; left:0; right:0; top:0; bottom:var(--row); padding:6.5vh 5.5vw 2vh; box-sizing:border-box; display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 0.92fr); gap:4vw; transition:transform 6s ease }
body.saver #wrap { bottom:22vh; padding:9vh 7vw 2vh }
.left { display:flex; flex-direction:column; min-width:0 }
#clock { font:700 16vh/.9 var(--f-display); letter-spacing:-.035em; font-variant-numeric:tabular-nums; white-space:nowrap; text-shadow:0 0 5vh var(--haloA), 0 0 1.2vh rgba(255,255,255,.12) }
body.saver #clock { font-size:21vh }
#clock .ap { font-size:.27em; margin-left:.35em; font-weight:600; letter-spacing:.06em; color:var(--ink2); text-shadow:none }
#date { font:var(--f-holiday-w) 4.6vh/1.15 var(--f-holiday); color:var(--accent); margin-top:2vh; text-shadow:0 0 3vh var(--haloA) }
#wx { display:flex; align-items:center; gap:1.8vh; margin-top:3.4vh; color:var(--ink2); font-size:2.6vh; line-height:1.3 }
#wx > svg { width:7vh; height:7vh; color:var(--gold); flex:none; filter:drop-shadow(0 0 1.6vh var(--haloG)) }
#wx b { display:block; font:700 5.2vh/1 var(--f-display); color:var(--ink) }
/* In the screensaver, with photos on the right, the next thing on the calendar moves under the weather. */
#next { display:none; position:relative; margin-top:4.5vh; padding-left:2.4vh }
#next::before { content:''; position:absolute; left:0; top:.4vh; bottom:.4vh; width:.7vh; border-radius:1vh; background:var(--c, var(--accent)); box-shadow:0 0 1.8vh .2vh var(--c, var(--accent)) }
#next:empty { display:none !important }
body.photos #next { display:block }
#next .when { font-size:2.3vh; color:var(--gold); font-weight:700; font-variant-numeric:tabular-nums }
#next .what { font:700 3.6vh/1.2 var(--f-display); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:.3vh }
.right { position:relative; min-width:0; align-self:start; background:var(--card); border:1px solid var(--line); border-radius:3vh; padding:3.2vh 3.4vh 2.4vh;
  box-shadow:0 2vh 6vh rgba(0,0,0,.25), 0 0 7vh -1vh var(--glowA), inset 0 1px 0 rgba(255,255,255,.06) }
/* A thin glowing edge along the top of the card. */
.right::before { content:''; position:absolute; left:8%; right:8%; top:-1px; height:2px; border-radius:2px; background:linear-gradient(90deg, transparent, var(--accent), var(--gold), transparent); opacity:.75; box-shadow:0 0 1.6vh var(--haloA) }
/* On a busy day the card stops above the app row instead of running behind it. */
body.home .right { max-height:100%; box-sizing:border-box; overflow:hidden }
.lbl { font-size:1.8vh; letter-spacing:.16em; text-transform:uppercase; color:var(--ink2); font-weight:700 }
#up { margin-top:1vh }
.ev { display:grid; grid-template-columns:.7vh minmax(0, 1fr); gap:1.8vh; padding:1.5vh 0; border-bottom:1px solid var(--line) }
.ev:last-child { border-bottom:0 }
.ev i { border-radius:1vh; background:var(--c) }
.ev.first i { box-shadow:0 0 1.6vh .2vh var(--c) }
.ev.now i { animation:tv-breathe 3.2s ease-in-out infinite }
@keyframes tv-breathe { 50% { box-shadow:0 0 2.8vh .5vh var(--c) } }
.ev .when { font-size:2.3vh; color:var(--gold); font-weight:700; font-variant-numeric:tabular-nums }
.ev .what { font:700 3.2vh/1.2 var(--f-display); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:.3vh }
.ev.first .what { font-size:4vh }
.none { margin:1.6vh 0 .6vh; font-size:2.7vh; color:var(--ink2) }
#dinner, #chores { display:flex; align-items:baseline; gap:1.6vh; margin-top:1.6vh; font-size:2.6vh; min-width:0 }
#dinner:empty, #chores:empty { display:none }
#dinner .dn { font:700 3.2vh/1.2 var(--f-display); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
#chores { color:var(--ink2) } #chores b { color:var(--ink) }
.right > .lbl:first-child { display:block }
/* Screensaver slideshow: takes the right side in place of Up next when there are photos. Each photo sits whole on a
   blurred, darkened copy of itself, drifts in very slowly, and fades into the next. */
#photo { display:none; position:relative; min-width:0; height:62vh; align-self:start; border-radius:3vh; overflow:hidden; background:#000;
  box-shadow:0 2vh 6vh rgba(0,0,0,.45), 0 0 9vh -1vh var(--haloA), 0 0 0 1px rgba(255,255,255,.1) }
body.photos .right { display:none }
body.photos #photo { display:block }
#photo .ph { position:absolute; inset:0; opacity:0; transition:opacity 2s ease }
#photo .ph.show { opacity:1 }
#photo .bk { position:absolute; inset:-6%; background-size:cover; background-position:center; filter:blur(4vh) brightness(.55) saturate(1.2) }
#photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transform:scale(1); transition:transform 18s linear }
#photo .ph.show img { transform:scale(1.06) }
#photo::after { content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), inset 0 -10vh 8vh -8vh rgba(0,0,0,.35) }
#lane { position:fixed; left:5vw; width:42vw; bottom:calc(var(--row) - 1vh); height:22vh; pointer-events:none; z-index:2 }
body.saver #lane { bottom:3vh; height:20vh; left:6vw; right:6vw }
#lane .hero-pace { height:100%; bottom:0 }
.hero-visit { z-index:3 }
@media (prefers-reduced-motion: reduce) { #motes { display:none } #wrap { transition:none } #glow i, .ev.now i { animation:none }
  #photo img, #photo .ph.show img { transition:none; transform:none }
  .hero, .hero svg *, .hero-pace, .hero-pace .hv-turn, .stk-a { animation:none !important } .hero-visit { display:none } }

.stk { display:inline-block; width:var(--sz, 48px); height:var(--sz, 48px); flex:none; transform:rotate(var(--r0, 0deg)); pointer-events:none }
.stk-a { display:block; width:100%; height:100%; animation:var(--an, none) var(--du, 4s) ease-in-out var(--dl, 0s) infinite; transform-origin:50% 60%; will-change:transform }
.stk svg { display:block; width:100%; height:100%; overflow:visible }
.a-bob { --an:hb-bob } .a-sway { --an:hb-sway; transform-origin:50% 6% } .a-spin { --an:hb-spin; animation-timing-function:linear !important; transform-origin:50% 50% }
.a-twinkle { --an:hb-twinkle; transform-origin:50% 50% } .a-float { --an:hb-float } .a-wiggle { --an:hb-wiggle; transform-origin:50% 85% }
.a-dance { --an:hb-dance; transform-origin:50% 90% } .a-hop { --an:hb-hop; transform-origin:50% 100% } .a-pulse { --an:hb-pulse; transform-origin:50% 55% }
.a-flap { --an:hb-flap; transform-origin:50% 50% } .a-flip { --an:hb-flip; transform-origin:50% 50%; animation-timing-function:linear !important }
:root.deco-still .stk-a { animation:none }
@keyframes hb-bob { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-8%) } }
@keyframes hb-sway { 0%,100% { transform:rotate(-8deg) } 50% { transform:rotate(8deg) } }
@keyframes hb-spin { to { transform:rotate(360deg) } }
@keyframes hb-twinkle { 0%,100% { transform:scale(1); opacity:1 } 50% { transform:scale(.8); opacity:.65 } }
@keyframes hb-float { 0%,100% { transform:translate(0,0) rotate(0) } 33% { transform:translate(6%,-9%) rotate(4deg) } 66% { transform:translate(-5%,-4%) rotate(-4deg) } }
@keyframes hb-wiggle { 0%,68%,100% { transform:rotate(0) } 74% { transform:rotate(-10deg) } 80% { transform:rotate(9deg) } 86% { transform:rotate(-6deg) } 92% { transform:rotate(3deg) } }
@keyframes hb-dance { 0%,100% { transform:rotate(-9deg) translateY(0) } 25% { transform:rotate(0) translateY(-7%) } 50% { transform:rotate(9deg) translateY(0) } 75% { transform:rotate(0) translateY(-7%) } }
@keyframes hb-hop { 0%,52%,100% { transform:translateY(0) scale(1,1) } 60% { transform:translateY(0) scale(1.08,.9) } 72% { transform:translateY(-18%) scale(.95,1.06) } 84% { transform:translateY(0) scale(1.06,.93) } 92% { transform:translateY(0) scale(1,1) } }
@keyframes hb-pulse { 0%,100% { transform:scale(1) } 12% { transform:scale(1.13) } 24% { transform:scale(1) } 36% { transform:scale(1.08) } 48% { transform:scale(1) } }
@keyframes hb-flap { 0%,100% { transform:scaleX(1) translateY(0) } 50% { transform:scaleX(.6) translateY(-5%) } }
@keyframes hb-flip { to { transform:rotateY(360deg) } }
/* big characters */
.hero { display:block; width:100%; height:100% }
.hero svg { display:block; width:100%; height:100%; overflow:visible }
.hv-turn { display:block; width:100%; height:100% }
.hero svg * { animation-delay: var(--hd, 0s) }
.hv-wave { animation: hv-wave 1.6s ease-in-out infinite } .hv-wave2 { animation: hv-wave2 1.6s ease-in-out infinite }
@keyframes hv-wave { 0%,100% { transform: rotate(-14deg) } 50% { transform: rotate(22deg) } }
@keyframes hv-wave2 { 0%,100% { transform: rotate(14deg) } 50% { transform: rotate(-22deg) } }
.hv-wheel { animation: hv-spin 1.1s linear infinite } @keyframes hv-spin { to { transform: rotate(360deg) } }
.hv-leg1 { animation: hv-leg .8s ease-in-out infinite } .hv-leg2 { animation: hv-leg2 .8s ease-in-out infinite }
@keyframes hv-leg { 0%,100% { transform: rotate(-18deg) } 50% { transform: rotate(18deg) } } @keyframes hv-leg2 { 0%,100% { transform: rotate(18deg) } 50% { transform: rotate(-18deg) } }
.hv-wing { animation: hv-wing .6s ease-in-out infinite } @keyframes hv-wing { 50% { transform: rotate(-22deg) scaleY(.88) } }
.hv-tail { animation: hv-tail 1.5s ease-in-out infinite } @keyframes hv-tail { 0%,100% { transform: rotate(-10deg) } 50% { transform: rotate(12deg) } }
.hv-fan { animation: hv-fan 1.9s ease-in-out infinite } @keyframes hv-fan { 50% { transform: scale(1.07) rotate(2deg) } }
.hv-flag { animation: hv-flag 1.3s ease-in-out infinite } @keyframes hv-flag { 0%,100% { transform: skewY(-5deg) scaleX(1) } 50% { transform: skewY(5deg) scaleX(.94) } }
.hv-ear { animation: hv-ear 3.2s ease-in-out infinite } .hv-ear2 { animation: hv-ear2 3.2s ease-in-out infinite }
@keyframes hv-ear2 { 0%,40%,62%,100% { transform: rotate(0) } 46% { transform: rotate(14deg) } 54% { transform: rotate(-6deg) } }
@keyframes hv-ear { 0%,78%,100% { transform: rotate(0) } 84% { transform: rotate(-14deg) } 92% { transform: rotate(6deg) } }
.hv-blink { animation: hv-blink 4.6s linear infinite } @keyframes hv-blink { 0%,93%,100% { transform: scaleY(1) } 96.5% { transform: scaleY(.12) } }
.hv-shake { animation: hv-shake .45s linear infinite } @keyframes hv-shake { 0%,100% { transform: rotate(-7deg) } 50% { transform: rotate(7deg) } }
.hv-shake2 { animation: hv-shake2 2.6s ease-in-out infinite } @keyframes hv-shake2 { 0%,70%,100% { transform: rotate(0) } 76% { transform: rotate(-6deg) } 84% { transform: rotate(6deg) } 92% { transform: rotate(-3deg) } }
.hv-pop { animation: hv-pop 2.6s ease-out infinite } @keyframes hv-pop { 0%,38% { transform: translate(0,0) rotate(0); opacity:1 } 55% { transform: translate(10px,-30px) rotate(150deg); opacity:1 } 72%,100% { transform: translate(14px,-40px) rotate(220deg); opacity:0 } }
.hv-burst { animation: hv-burst 2.6s ease-out infinite } @keyframes hv-burst { 0%,40% { transform: scale(.2); opacity:0 } 52% { opacity:1 } 85% { transform: scale(1.1); opacity:1 } 100% { transform: scale(1.18); opacity:0 } }
.hv-bob { animation: hv-bobi .8s ease-in-out infinite } .hv-bob2 { animation: hv-bobi2 .8s ease-in-out infinite } @keyframes hv-bobi2 { 0%,100% { transform: translateY(-3px) } 50% { transform: translateY(0) } } @keyframes hv-bobi { 50% { transform: translateY(-3px) } }
.hv-twk { animation: hv-twk 1.8s ease-in-out infinite } @keyframes hv-twk { 50% { opacity:.35 } }
.hv-puff { animation: hv-puff 1.4s ease-out infinite } @keyframes hv-puff { 0% { transform: translate(0,0); opacity:1 } 100% { transform: translate(-14px,-6px); opacity:0 } }
.hero-pace { position:absolute; left:0; bottom:2px; height:calc(100% - 22px); max-width:100%; animation:hb-pace var(--pd) linear var(--pdl) infinite }
.hero-pace.stay { left:50%; transform:translateX(-50%); animation:none }
.hero-pace .hv-turn { animation:hb-turn var(--pd) step-end var(--pdl) infinite } .hero-pace.stay .hv-turn { animation:none }
@keyframes hb-pace { 0%,5% { left:0; transform:translateX(0) } 45%,55% { left:100%; transform:translateX(-100%) } 95%,100% { left:0; transform:translateX(0) } }
@keyframes hb-turn { 0% { transform:scaleX(1) } 50% { transform:scaleX(-1) } }
.go-hop .hero { animation:hb-hopy .9s ease-in-out var(--hd) infinite }
@keyframes hb-hopy { 0%,100% { transform:translateY(0) scale(1,1) } 12% { transform:translateY(0) scale(1.05,.94) } 50% { transform:translateY(-18%) scale(.97,1.04) } 88% { transform:translateY(0) scale(1.04,.96) } }
.go-fly .hero { animation:hb-flyy 3.2s ease-in-out var(--hd) infinite }
@keyframes hb-flyy { 0%,100% { transform:translateY(0) rotate(-2deg) } 50% { transform:translateY(-9%) rotate(2deg) } }
.hero-visit { position:fixed; left:0; z-index:15; pointer-events:none; animation:hb-cross var(--vd) linear forwards; filter:drop-shadow(0 5px 6px rgb(0 0 0 / .16)) }
.hero-visit.rtl { animation-name:hb-cross-rtl } .hero-visit.rtl > .hv-turn { transform:scaleX(-1) }
@keyframes hb-cross { from { transform:translateX(-100%) } to { transform:translateX(100vw) } }
@keyframes hb-cross-rtl { from { transform:translateX(100vw) } to { transform:translateX(-100%) } }
:root.deco-still .hero, :root.deco-still .hero svg *, :root.deco-still .hero-pace, :root.deco-still .hero-pace .hv-turn { animation:none !important }
:root.deco-still .hero-visit { display:none }

</style></head><body>
<div id="glow" aria-hidden="true"><i class="g1"></i><i class="g2"></i><i class="g3"></i></div><div id="pat"></div><div id="motes"></div><div id="fade"></div>
<main id="wrap">
  <section class="left"><div id="clock"></div><div id="date"></div><div id="wx"></div><div id="next"></div></section>
  <section class="right"><span class="lbl">Up next</span><div id="up"></div><div id="dinner"></div><div id="chores"></div></section>
  <section id="photo" aria-hidden="true"></section>
</main>
<div id="lane" aria-hidden="true"></div>
<script>
(() => {
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const W = {
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 19h10.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.6 1.3A3.4 3.4 0 0 0 7 19z"/></svg>',
  partly:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v1.5M3 8h1.5M4.5 4.5l1 1M12.5 4.5l-1 1"/><path d="M5.3 10.6A3.5 3.5 0 0 1 11.6 6"/><path d="M9 20h9a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.7 1.1A3 3 0 0 0 9 20z"/></svg>',
  rain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h10.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.6 1.3A3.4 3.4 0 0 0 7 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></svg>',
  storm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h10.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.6 1.3A3.4 3.4 0 0 0 7 15z"/><path d="M12.5 15l-2 3.5h3l-2 3.5"/></svg>',
  fog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h18M5 12h14M3 16h18M7 20h10"/></svg>',
  snow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h10.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.6 1.3A3.4 3.4 0 0 0 7 15z"/><path d="M8 19h.01M12 20h.01M16 19h.01M10 22h.01M14 22h.01" stroke-width="3"/></svg>'
};
function wxIcon(code, night) {
  const c = Number(code) || 0;
  if (c >= 33 && c <= 34) return W.moon;
  if (c >= 35 && c <= 38) return W.cloud;
  if (c === 11) return W.fog;
  if ([12,13,14,18,39,40].includes(c)) return W.rain;
  if ([15,16,17,41,42].includes(c)) return W.storm;
  if ((c >= 19 && c <= 29) || c === 43 || c === 44) return W.snow;
  if (c >= 6 && c <= 8) return W.cloud;
  if (c >= 3 && c <= 5) return night ? W.cloud : W.partly;
  return night ? W.moon : W.sun;
}


/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());

/* ---------- the TV home screen ----------
   Shown by the Home Base launcher on the TV: behind the row of apps (?mode=home) and as the screensaver (?mode=saver).
   Everything comes from the bridge's read-only tv.json, which Home Base fills in whenever something changes:
   what's up next, the weather, tonight's dinner, and the colors or holiday theme on the wall. No sign-in needed. */

const D = { data: null, ht: null, look: '', timer: 0 };

function whenText(e, now) {

  if (e.ad) {
    const d = parseYmd(e.s);

  S.settings.holidayMode = ht ? 'pick' : 'off'; S.settings.holidayTheme = ht ? ht.id : '';
  const main = ht ? ht.main : isHex(lk.main) ? lk.main : '#1D5B4A', hi = ht ? ht.hi : isHex(lk.hi) ? lk.hi : '#C98A12';

  if (!d || !d.ok) h = `<p class="none">Open Home Base once and what's coming up will show here.</p>`;
  else if (!up.length) h = `<p class="none">Nothing else on the calendar for the next few days.</p>`;
  else h = up.slice(0, max).map((e, i) => `<div class="ev${i ? '' : ' first'}${isNow(e, now) ? ' now' : ''}" style="--c:${esc(e.c || 'var(--accent)')}"><i></i><div><div class="when">${esc(whenText(e, now))}</div><div class="what">${esc(e.t)}</div></div></div>`).join('');
  $('#up').innerHTML = h;
  const nx = up[0];
  $('#next').innerHTML = nx ? `<div class="when">${esc(whenText(nx, now))}</div><div class="what">${esc(nx.t)}</div>` : '';
  $('#next').style.setProperty('--c', nx && nx.c ? nx.c : 'var(--accent)');
  syncPhotos();
  /* Tonight's dinner and chores still to do */
  const late = now.getHours() >= 20;
  const dinner = d && (late ? d.dinnerTomorrow : d.dinner);
  $('#dinner').innerHTML = dinner ? `<span class="lbl">${late ? 'Tomorrow night' : 'Tonight'}</span><span class="dn">${esc(dinner)}</span>` : '';
  const left = (d && d.chores || []).filter(c => c.left && c.left.length);
  $('#chores').innerHTML = d && d.chores && d.chores.length ? `<span class="lbl">Chores</span><span>${left.length ? left.map(c => `${esc(c.who)} <b>${c.left.length} left</b>`).join(' · ') : 'All done today ★'}</span>` : '';
  /* On a busy day, drop the last calendar items until dinner and chores fit above the app row. */
  const card = $('.right'), evs = () => $('#up').querySelectorAll('.ev');
  while (MODE === 'home' && card.scrollHeight > card.clientHeight + 2 && evs().length > 1) evs()[evs().length - 1].remove();
}

function isNow(e, now) { if (e.ad) return false; const s = new Date(e.s); return s <= now; }

/* ---------- screensaver slideshow ----------
   In the screensaver the right side shows the wall's screensaver photos (Home Base sends small copies to the bridge;
   tv.json lists them and p/ID serves each one). With no photos yet, Up next stays there instead. */
const PH = { ids: [], order: [], i: 0, timer: 0, cur: null, on: false };
const PHOTO_MS = 15000;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function syncPhotos() {
  const ids = MODE === 'saver' && D.data && Array.isArray(D.data.photos) ? D.data.photos.filter(x => /^[A-Za-z0-9_-]+$/.test(x)) : [];
  if (ids.join() === PH.ids.join()) return;
  PH.ids = ids; PH.order = shuffle(ids); PH.i = 0;
  if (!ids.length) { PH.on = false; clearTimeout(PH.timer); document.body.classList.remove('photos'); $('#photo').innerHTML = ''; return; }
  if (!PH.on) { PH.on = true; nextPhoto(); }
}
function nextPhoto() {
  clearTimeout(PH.timer);
  if (!PH.ids.length) return;
  if (PH.i >= PH.order.length) { PH.order = shuffle(PH.ids); PH.i = 0; }
  const id = PH.order[PH.i++], src = DEMO ? demoPhoto(id) : `p/${encodeURIComponent(id)}`;
  const img = new Image();
  img.onload = () => {
    const box = $('#photo'), el = document.createElement('div');
    el.className = 'ph';
    el.innerHTML = `<div class="bk"></div>`;
    el.firstChild.style.backgroundImage = `url("${src}")`;
    img.alt = ''; el.appendChild(img); box.appendChild(el);
    document.body.classList.add('photos');
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
    const old = PH.cur; PH.cur = el;
    if (old) { old.classList.remove('show'); setTimeout(() => old.remove(), 2200); }
    PH.timer = setTimeout(nextPhoto, PHOTO_MS);
  };
  /* A photo that won't load is skipped (it may have just been removed on the wall). */
  img.onerror = () => { PH.timer = setTimeout(nextPhoto, PH.cur ? 2000 : 500); };
  img.src = src;
}
/* Sample pictures for the demo code: soft gradients, so the layout can be checked without real photos. */
function demoPhoto(id) {
  const h = holHash(id) % 360, w = 1280, ht = id.length % 2 ? 960 : 1600;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${ht}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},70%,55%)"/><stop offset="1" stop-color="hsl(${(h + 60) % 360},70%,30%)"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><circle cx="${w * .7}" cy="${ht * .3}" r="${ht * .12}" fill="rgba(255,255,255,.55)"/></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

/* "demo" as the code shows made-up sample data, to preview the screen before connecting. */
const DEMO = /\/w\/demo\//.test(location.href);
function demoData() {
  const t = today(), at = (d, h, m) => { const x = addDays(t, d); x.setHours(h, m || 0, 0, 0); return x.toISOString(); };
  return { ok: true, dinner: 'Pizza night', dinnerTomorrow: 'Tacos', chores: [{ who: 'Liam', total: 3, left: ['Feed the dog', 'Trash'] }, { who: 'Cass', total: 1, left: [] }],
    up: [{ t: 'Soccer practice', s: at(0, 18, 30), e: at(0, 19, 30), ad: false, c: '#2E9B6A' }, { t: 'Work', s: at(1, 9), e: at(1, 17), ad: false, c: '#3F7FD9' },
      { t: 'Grocery run', s: at(1, 18), e: at(1, 19), ad: false, c: '#C98A12' }, { t: 'Pumpkin carving', s: ymd(addDays(t, 2)), e: '', ad: true, c: '#E8913A' }],
    wx: { now: 72, ph: 'Mostly sunny', ic: 2, night: false, hi: 78, lo: 60, rain: 10 }, look: { th: 'moonlitwoods' }, photos: ['beach', 'porch', 'pumpkins', 'park'] };
}
async function load() {
  if (DEMO) { D.data = demoData(); applyLook(D.data); render(); return; }
  try {
    const r = await fetch('tv.json', { cache: 'no-store' });
    if (r.ok) { D.data = await r.json(); try { localStorage.setItem('hbtv.data', JSON.stringify(D.data)); } catch (e) {} }
  } catch (e) {}
  applyLook(D.data); render();
}
window.hbRefresh = () => { load(); renderLane(); };

/* Keeps the screensaver from sitting in one spot all night. */
function drift() {
  if (MODE !== 'saver') return;
  const r = Math.random, w = $('#wrap');
  w.style.transform = `translate(${(r() * 4 - 2).toFixed(2)}vw, ${(r() * 4 - 2).toFixed(2)}vh)`;
}

applyLook(D.data); render();
load();
setInterval(load, 20000);   // picks up a new theme or calendar change within about 20 seconds
(function tickClock() { renderClock(); setTimeout(tickClock, 60000 - Date.now() % 60000 + 50); })();
setInterval(render, 30000);
/* Very quiet ambient pads on the home screen only (not the screensaver): slow, warm chords with no melody, each one
   fading into the next. Made with the wall's Web Audio pieces (nothing to download). The app stops it whenever
   another app or the screensaver opens. */
const AMB = { on: false, timer: 0, i: 0, next: 0, vol: 0.22, keep: false };
const AMB_CHORDS = [[48, 55, 59, 64], [45, 52, 55, 60], [41, 48, 52, 57], [43, 50, 53, 62]];   /* Cmaj7, Am7, Fmaj7, G sus */
function ambVoice(f, t, dur, vol) {
  const c = MU.ctx, end = t + dur + 6, lp = c.createBiquadFilter(), g = c.createGain();
  lp.type = 'lowpass'; lp.frequency.value = 620; lp.Q.value = 0.3;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 4); g.gain.setValueAtTime(vol, t + dur);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 5.5);
  [[ 'sine', 0 ], [ 'triangle', -6 ], [ 'triangle', 6 ]].forEach(([type, det]) => { const o = muOsc(type, f, t, end); o.detune.value = det; o.connect(lp); });
  lp.connect(g); muOut(g, 0.8);
}
function ambTick() {
  const c = MU.ctx; if (!AMB.on || !c || c.state !== 'running') return;
  if (AMB.next < c.currentTime) AMB.next = c.currentTime + 0.2;
  /* Scheduled well ahead: behind the screensaver the page is hidden and its timers can slow to once a minute. */
  while (AMB.next < c.currentTime + 75) {
    const ch = AMB_CHORDS[AMB.i++ % AMB_CHORDS.length];
    ch.forEach((m, n) => ambVoice(mtof(m), AMB.next + n * 0.35, 9, n ? 0.012 : 0.016));
    AMB.next += 10;
  }
}
function ambStart() {
  if (MODE !== 'home' || document.hidden || !muInit()) return;
  const g = MU.master.gain, now = MU.ctx.currentTime;
  if (!AMB.on) { AMB.on = true; clearInterval(AMB.timer); AMB.timer = setInterval(ambTick, 500); }
  const go = () => { g.cancelScheduledValues(MU.ctx.currentTime); g.setValueAtTime(Math.max(0.0001, g.value), MU.ctx.currentTime); g.linearRampToValueAtTime(AMB.vol, MU.ctx.currentTime + 3); ambTick(); };
  if (MU.ctx.state !== 'running') MU.ctx.resume().then(go, () => {}); else go();
}
function ambStop() {
  if (!AMB.on || !MU.ctx) return; AMB.on = false; clearInterval(AMB.timer);
  const g = MU.master.gain, now = MU.ctx.currentTime; g.cancelScheduledValues(now); g.setValueAtTime(Math.max(0.0001, g.value), now); g.linearRampToValueAtTime(0.0001, now + 1.5);
  setTimeout(() => { if (!AMB.on && MU.ctx) MU.ctx.suspend().catch(() => {}); }, 1800);
}
/* The home screen's music is now recorded zen music played by the app itself (see Zen.java); these pads stay off. */
/* The app calls hbMusic(true) when home shows, 'keep' when the screensaver covers it (the music plays on), false otherwise. */
window.hbMusic = on => {
  AMB.keep = on === 'keep'; clearTimeout(AMB.sleepT);
  /* The screensaver lets the box go to sleep after two hours, so the music goes quiet then too. */
  if (on === 'keep') { AMB.sleepT = setTimeout(ambStop, 2 * 3600e3); return; }
  if (on) ambStart(); else ambStop();
};
if (MODE === 'saver') { setInterval(drift, 90000); setInterval(visit, 40000); setTimeout(visit, 8000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) window.hbRefresh(); });
requestAnimationFrame(() => { document.body.classList.add('ready'); try { HB_APP && HB_APP.ready(); } catch (e) {} });

})();
</script></body></html>
