name: Deploy to Cloudflare

# Every push to main goes live. Needs one repo secret: CLOUDFLARE_API_TOKEN
# (the "API token for external CI/CD" from the drivez worker's Settings -> Builds page).
# The account id is in wrangler.toml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the Cloudflare token is there
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing. Add it under Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # wrangler.toml's [build] runs "npm run build" first.
        # The deploy token can only upload and release this worker, so upload a
        # version and then send 100% of traffic to it (plain "deploy" needs more access).
        run: |
          npx wrangler versions upload --message "${GITHUB_SHA::7}" | tee upload.log
          id=$(grep -oE 'Worker Version ID: [0-9a-f-]+' upload.log | awk '{print $4}')
          if [ -z "$id" ]; then echo "::error::Upload didn't return a version id."; exit 1; fi
          npx wrangler versions deploy "$id@100%" --yes --message "${GITHUB_SHA::7}"

      - name: Report the live version
        run: |
          sleep 5
          echo "Live bundle: $(curl -fsS https://drivez.webb-home.workers.dev/ | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)"
