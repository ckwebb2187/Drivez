<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071222" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/logo-text.webp" />
    <title>Kaido Maps</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Splash: an orange route draws in, the arrow rides it up and grows into the logo's arrow,
         then KAIDO MAPS wipes in under it with a glow. CSS/SVG only; never blocks taps, fades by itself. -->
    <div id="dz-splash" aria-hidden="true">
      <svg class="dzs-map" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
        <g class="dzs-topo" fill="none" stroke="#1d4a7a" stroke-width="1.4">
          <path d="M-20 140C60 90 120 170 200 130S330 60 420 110"/><path d="M-20 300C80 250 150 330 230 290S350 220 420 270"/>
          <path d="M-20 560C70 520 140 600 220 560S340 490 420 540"/><path d="M-20 720C90 680 160 760 240 720S350 650 420 700"/>
          <path d="M40 -20C10 120 90 220 60 360"/><path d="M340 870C370 730 300 640 330 500"/>
        </g>
        <path id="dzs-route" class="dzs-route" pathLength="1" d="M-10 820C40 700 170 760 175 640S70 520 140 470C162 440 172 392 210 352"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1s" begin="0.05s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".55 0 .35 1"/></path>
        <g><g class="dzs-arrow"><path d="M14 0L-12 11L-6 0L-12 -11Z" fill="#ff8a2a"/><path d="M14 0L-6 0L-12 -11Z" fill="#ffb05c"/></g>
          <animateMotion dur="1s" begin="0.05s" fill="freeze" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".55 0 .35 1"><mpath href="#dzs-route"/></animateMotion></g>
      </svg>
      <img class="dzs-word" src="/logo-text.webp" alt="" width="260" height="80" />
    </div>
    <style>
      #dz-splash{position:fixed;inset:0;z-index:9999;overflow:hidden;background:radial-gradient(120% 80% at 50% 45%,#0e2340 0%,#071222 60%,#04080f 100%);pointer-events:none;animation:dzs-out .5s ease 2s forwards}
      #dz-splash .dzs-map{position:absolute;inset:0;width:100%;height:100%}
      .dzs-topo{opacity:0;animation:dzs-fade .8s ease forwards}
      .dzs-route{fill:none;stroke:#ff7a1a;stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 5px #ff7a1a) drop-shadow(0 0 12px #ff4d00);animation:dzs-dim .6s ease 1.2s forwards}
      .dzs-arrow{transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 0 6px #ff9a3c) drop-shadow(0 0 16px #ff6a00);animation:dzs-grow .45s cubic-bezier(.2,1.5,.4,1) 1.02s forwards}
      #dz-splash .dzs-word{position:absolute;left:50%;top:50%;width:260px;height:auto;margin:-6px 0 0 -130px;opacity:0;clip-path:inset(0 100% 0 0);transform:translateY(8px);
        filter:drop-shadow(0 0 10px #ff7a1a55);animation:dzs-wipe .6s cubic-bezier(.6,0,.2,1) 1.2s forwards,dzs-glow 1s ease-in-out 1.8s infinite alternate}
      @keyframes dzs-draw{to{stroke-dashoffset:0}}
      @keyframes dzs-dim{to{opacity:.22}}
      @keyframes dzs-fade{to{opacity:.55}}
      @keyframes dzs-grow{to{transform:scale(2.6)}}
      @keyframes dzs-wipe{to{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
      @keyframes dzs-glow{to{filter:drop-shadow(0 0 18px #ff7a1a99)}}
      @keyframes dzs-out{to{opacity:0;visibility:hidden}}
      @media (prefers-reduced-motion:reduce){#dz-splash{display:none}}
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
